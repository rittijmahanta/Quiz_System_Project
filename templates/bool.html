<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Boolean Quiz</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #e0eafc, #cfdef3);
      min-height: 100vh;
      padding: 40px 20px;
      font-family: 'Poppins', sans-serif;
    }
    h2 {
      font-weight: 700;
      color: #333;
      margin-bottom: 40px;
    }
    .card {
      border: none;
      border-radius: 1rem;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
      background: #fff;
      transition: transform 0.2s, box-shadow 0.2s ease-in-out;
    }
    .card:hover {
      transform: translateY(-10px);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.15);
    }
    .form-check-input:checked {
      background-color: #0d6efd;
      border-color: #0d6efd;
    }
    .form-check-label {
      cursor: pointer;
    }
    .answer {
      display: none;
      margin-top: 20px;
      padding: 12px;
      border-radius: 8px;
      font-weight: 500;
      transition: all 0.3s ease-in-out;
    }
    .correct {
      background-color: #d1e7dd;
      color: #0f5132;
    }
    .incorrect {
      background-color: #f8d7da;
      color: #842029;
    }
    .btn-outline-secondary:hover {
      background-color: #dee2e6;
    }
    .results {
      margin-top: 30px;
      font-size: 20px;
      font-weight: bold;
      color: #333;
    }
    .btn-submit {
      width: 100%;
      padding: 15px;
      font-size: 18px;
    }
    .btn-clear {
      width: 100%;
      font-size: 16px;
    }
    .card-body {
      padding: 30px;
    }
    .question-title {
      font-size: 1.25rem;
      font-weight: 600;
      color: #333;
    }
    .form-check-label {
      font-size: 1rem;
      font-weight: 500;
    }
  </style>
</head>

<body>
<div class="container">
  <h2 class="text-center mb-5">🧠 Boolean Quiz</h2>

  <form id="quizForm">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        {% for q in questions %}
          {% set q_index = loop.index0 %}
          <div class="card p-4 mb-4" data-question-index="{{ q_index }}">
            <div class="card-body">
              <h5 class="question-title mb-4"><strong>Q{{ loop.index }}:</strong> 
                {% if q.question_statement %}
                  {{ q.question_statement }}
                {% elif q.question %}
                  {{ q.question }}
                {% else %}
                  {{ q }}
                {% endif %}
              </h5>

              <ul class="list-unstyled">
                <li class="mb-3">
                  <div class="form-check">
                    <input class="form-check-input" type="radio" name="q{{ q_index }}" value="True" onchange="showAnswer({{ q_index }})" id="true{{ q_index }}">
                    <label class="form-check-label" for="true{{ q_index }}">True</label>
                  </div>
                </li>
                <li class="mb-3">
                  <div class="form-check">
                    <input class="form-check-input" type="radio" name="q{{ q_index }}" value="False" onchange="showAnswer({{ q_index }})" id="false{{ q_index }}">
                    <label class="form-check-label" for="false{{ q_index }}">False</label>
                  </div>
                </li>
              </ul>

              <div class="d-flex align-items-center mb-3">
                <button type="button" class="btn btn-outline-secondary btn-sm me-2 btn-clear" onclick="clearSelection({{ q_index }})">Clear Selection</button>
              </div>

              <div class="answer" id="answer{{ q_index }}">
                <strong>Correct Answer:</strong> {{ 'True' if q.answer else 'False' }}
              </div>
              <input type="hidden" id="correctAnswer{{ q_index }}" value="{{ 'True' if q.answer else 'False' }}">
            </div>
          </div>
        {% endfor %}

        <div class="text-center mt-4">
          <button type="button" class="btn btn-success btn-lg btn-submit" onclick="submitQuiz()">Submit Quiz</button>
        </div>

        <div id="results" class="results text-center" style="display: none;"></div>
      </div>
    </div>
  </form>
</div>

<script>
function showAnswer(questionIndex) {
  const selectedOption = document.querySelector(`input[name="q${questionIndex}"]:checked`);
  const correctAnswer = document.getElementById(`correctAnswer${questionIndex}`).value.trim().toLowerCase();
  const answerDiv = document.getElementById(`answer${questionIndex}`);

  const allOptions = document.querySelectorAll(`input[name="q${questionIndex}"]`);
  allOptions.forEach(option => {
    option.disabled = true;
  });

  if (selectedOption) {
    answerDiv.style.display = 'block';
    if (selectedOption.value.trim().toLowerCase() === correctAnswer) {
      answerDiv.className = 'answer correct';
    } else {
      answerDiv.className = 'answer incorrect';
    }
  }
}

function clearSelection(questionIndex) {
  const options = document.querySelectorAll(`input[name="q${questionIndex}"]`);
  options.forEach(option => {
    option.checked = false;
    option.disabled = false;
  });
  const answerDiv = document.getElementById(`answer${questionIndex}`);
  answerDiv.style.display = 'none';
  answerDiv.className = 'answer';
}

function submitQuiz() {
  const totalQuestions = document.querySelectorAll('.card').length;
  let correctCount = 0;
  let incorrectCount = 0;
  let unansweredCount = 0;

  for (let i = 0; i < totalQuestions; i++) {
    const selectedOption = document.querySelector(`input[name="q${i}"]:checked`);
    const correctAnswer = document.getElementById(`correctAnswer${i}`).value.trim().toLowerCase();

    if (!selectedOption) {
      unansweredCount++;
      continue;
    }

    if (selectedOption.value.trim().toLowerCase() === correctAnswer) {
      correctCount++;
    } else {
      incorrectCount++;
    }
  }

  const resultDiv = document.getElementById('results');
  resultDiv.innerHTML = `
    ✅ <strong>Correct:</strong> ${correctCount} / ${totalQuestions}<br>
    ❌ <strong>Incorrect:</strong> ${incorrectCount} / ${totalQuestions}<br>
    ❓ <strong>Unanswered:</strong> ${unansweredCount} / ${totalQuestions}
  `;
  resultDiv.style.display = 'block';
}
</script>

</body>
</html>
