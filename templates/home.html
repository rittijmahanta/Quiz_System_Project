<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(to right, #eef2f3, #8e9eab);
      min-height: 100vh;
    }
    .card-custom {
      border: none;
      border-radius: 1rem;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      background: #ffffff;
    }
    .card-custom:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.15);
    }
    .btn-custom {
      font-weight: 600;
      border-radius: 50px;
      padding: 10px 20px;
      transition: background 0.3s, transform 0.2s;
    }
    .btn-yellow {
      background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
      color: black;
    }
    .btn-blue {
      background: linear-gradient(135deg, #89f7fe 0%, #66a6ff 100%);
      color: white;
    }
    .btn-red {
      background: linear-gradient(135deg, #f85032 0%, #e73827 100%);
      color: white;
    }
    .btn-outline-primary {
      border-radius: 50px;
    }
    .wave {
      animation: wave-animation 2s infinite;
      transform-origin: 70% 70%;
      display: inline-block;
    }
    @keyframes wave-animation {
      0% { transform: rotate(0deg); }
      10% { transform: rotate(14deg); }
      20% { transform: rotate(-8deg); }
      30% { transform: rotate(14deg); }
      40% { transform: rotate(-4deg); }
      50% { transform: rotate(10deg); }
      60% { transform: rotate(0deg); }
      100% { transform: rotate(0deg); }
    }
    input, textarea, select {
      border-radius: 0.5rem !important;
    }
    #articleSection, #customInputSection {
      transition: all 0.5s ease-in-out;
    }
  </style>
</head>

<body>
<div class="container py-5">
  <h2 class="text-center mb-5 fw-bold text-dark">
    Welcome, {{ session.username }} <span class="wave">👋</span>
  </h2>

  <div class="row g-4">
    <!-- Left Column -->
    <div class="col-md-6">
      <!-- Scrape Duration Card -->
      <div class="card p-4 card-custom">
        <form method="POST" class="d-flex align-items-center">
          <input type="number" name="duration" class="form-control me-3" placeholder="Scrape duration in minutes" required>
          <button type="submit" class="btn btn-primary btn-custom">Extract</button>
        </form>
      </div>

      <!-- Articles Card -->
      <div class="card p-4 mt-4 card-custom">
        <div class="d-flex justify-content-between align-items-center">
          <h5 class="mb-0 fw-bold">Articles 📃</h5>
          <button type="button" onclick="toggleArticles()" class="btn btn-outline-primary btn-sm">Toggle</button>
        </div>
        <div id="articleSection" style="display: none;" class="mt-4">
          <input type="text" id="searchInput" class="form-control mb-3" placeholder="Search article title..." onkeyup="filterArticles()">

          <div class="row mb-3">
            <div class="col">
              <label class="form-label">From:</label>
              <input type="date" id="from_date" class="form-control" onchange="filterByDate()">
            </div>
            <div class="col">
              <label class="form-label">To:</label>
              <input type="date" id="to_date" class="form-control" onchange="filterByDate()">
            </div>
          </div>

          <ul id="articleList" class="list-group mb-3">
            {% for article in articles %}
              <li class="list-group-item article-item" data-index="{{ loop.index0 }}" style="display: {{ 'block' if loop.index0 < 10 else 'none' }}">
                <div class="form-check">
                  <input class="form-check-input article-checkbox" type="checkbox" value="{{ article[0] }}">
                  <label class="form-check-label">
                    <a href="{{ article[1] }}" target="_blank" class="fw-bold text-decoration-none text-primary">{{ article[2] }}</a> ({{ article[4] }})
                  </label>
                </div>
              </li>
            {% endfor %}
          </ul>
          <div class="d-flex justify-content-between">
            <button id="showMoreBtn" onclick="showMoreArticles()" class="btn btn-outline-success btn-sm">Show More</button>
            <button id="showLessBtn" onclick="showLessArticles()" class="btn btn-outline-danger btn-sm">Show Less</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Right Column -->
    <div class="col-md-6">
      <!-- Custom Input Card -->
      <div class="card p-4 card-custom">
        <div class="d-flex justify-content-between align-items-center">
          <h5 class="mb-0 fw-bold">Submit Your Own Input 👤</h5>
          <button type="button" onclick="toggleCustomInput()" class="btn btn-outline-success btn-sm">Toggle</button>
        </div>
        <div id="customInputSection" style="display: none;" class="mt-4">
          <textarea id="custom_content" name="custom_content" class="form-control" rows="6" placeholder="Enter your custom article or content here..."></textarea>
        </div>
      </div>

      <!-- Generate Quiz Card -->
      <div class="card p-4 mt-4 card-custom">
        <h5 class="text-center fw-bold">🧐 Generate Quiz:</h5>
        <form id="combinedForm" action="{{ url_for('generate_questions', article_id=0) }}" method="POST">
          <input type="hidden" name="selected_articles" id="selected_articles_input">
          <input type="hidden" name="custom_content_hidden" id="custom_content_hidden">

          <div class="mb-3">
            <input type="number" name="num_questions" class="form-control" placeholder="Number of questions (Max 10)" min="0" max="10" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Select Method:</label>
            <select name="method" class="form-select" required>
              <option value="mcq">MCQ</option>
              <option value="bool">Boolean</option>
              <option value="faq">FAQ</option>
            </select>
          </div>

          <button type="submit" onclick="prepareForm()" class="btn btn-success btn-custom w-100">Generate Quiz</button>
        </form>
      </div>

      <!-- Other Actions -->
      <div class="text-center mt-4">
        <form action="{{ url_for('paraphrase_page') }}" method="GET" class="d-inline">
          <button type="submit" class="btn btn-yellow btn-custom mb-2">Paraphrase</button>
        </form>
        <form action="{{ url_for('question_answering') }}" method="GET" class="d-inline">
          <button type="submit" class="btn btn-blue btn-custom mb-2">Clear Doubts</button>
        </form>
        <div class="mt-3">
          <a href="/logout" class="btn btn-red btn-custom">Logout 🔒</a>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
  // (Keeping your exact same JavaScript functions here)
  let visibleCount = 10;
  function toggleArticles() {
    const section = document.getElementById('articleSection');
    section.style.display = section.style.display === 'none' ? 'block' : 'none';
  }
  function showMoreArticles() {
    const allArticles = document.querySelectorAll('.article-item');
    for (let i = visibleCount; i < visibleCount + 10 && i < allArticles.length; i++) {
      allArticles[i].style.display = 'block';
    }
    visibleCount += 10;
    if (visibleCount >= allArticles.length) {
      document.getElementById('showMoreBtn').style.display = 'none';
    }
  }
  function showLessArticles() {
    const allArticles = document.querySelectorAll('.article-item');
    visibleCount = Math.max(0, visibleCount - 10);
    for (let i = 0; i < allArticles.length; i++) {
      allArticles[i].style.display = i < visibleCount ? 'block' : 'none';
    }
    if (visibleCount < allArticles.length) {
      document.getElementById('showMoreBtn').style.display = 'inline-block';
    }
  }
  function filterArticles() {
    const input = document.getElementById('searchInput').value.toLowerCase();
    const articles = document.querySelectorAll('.article-item');
    articles.forEach(article => {
      const title = article.querySelector('a').textContent.toLowerCase();
      article.style.display = title.includes(input) ? 'block' : 'none';
    });
  }
  function toggleCustomInput() {
    const section = document.getElementById('customInputSection');
    section.style.display = section.style.display === 'none' ? 'block' : 'none';
  }
  function prepareForm() {
    const checkboxes = document.querySelectorAll('.article-checkbox');
    const selected = Array.from(checkboxes).filter(cb => cb.checked).map(cb => cb.value);
    document.getElementById('selected_articles_input').value = selected.join(',');
    const customContent = document.getElementById('custom_content').value.trim();
    document.getElementById('custom_content_hidden').value = customContent;
  }
  function filterByDate() {
    const fromDate = document.getElementById('from_date').value;
    const toDate = document.getElementById('to_date').value;
    const articles = document.querySelectorAll('.article-item');

    function convertToComparableDate(dateStr) {
      const parts = dateStr.split('-');
      const year = parts.length === 3 && parts[2].length === 4 ? parts[0] : '20' + parts[2];
      const month = parts[parts.length === 3 ? 1 : 0];
      const day = parts[parts.length === 3 ? 0 : 1];
      return `${year}-${month.padStart(2, '0')}-${day.padStart(2, '0')}`;
    }

    articles.forEach(article => {
      const articleDateText = article.querySelector('a').textContent.match(/\((\d{2}-\d{2}-\d{4}|\d{4}-\d{2}-\d{2})\)/);
      if (!articleDateText) return;

      const articleComparableDate = convertToComparableDate(articleDateText[1]);
      const fromComparableDate = fromDate ? convertToComparableDate(fromDate) : null;
      const toComparableDate = toDate ? convertToComparableDate(toDate) : null;

      const withinRange = (!fromComparableDate || articleComparableDate >= fromComparableDate) && (!toComparableDate || articleComparableDate <= toComparableDate);
      article.style.display = withinRange ? 'block' : 'none';
    });
  }
</script>
</body>
</html>
