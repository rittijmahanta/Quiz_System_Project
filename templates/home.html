<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Home</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .section-box {
      background: white;
      border-radius: 15px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      padding: 20px;
      margin-bottom: 30px;
    }
    .btn-custom {
      min-width: 120px;
    }
    .article-item {
      padding: 10px;
    }
    #articleSection, #customInputSection {
      margin-top: 20px;
    }
    body {
      background-color: #f8f9fa;
    }
  </style>
</head>

<body>

<div class="container py-4">
  <h2 class="text-center mb-5">Welcome, {{ session.username }} 👋</h2>

  <!-- Scrape Duration Section -->
  <div class="row g-3 mb-4 justify-content-center">
    <div class="col-md-4">
      <div class="input-group section-box">
        <input type="number" class="form-control" name="duration" placeholder="Scrape duration in minutes" required>
        <button type="submit" class="btn btn-primary">Extract</button>
      </div>
    </div>
  </div>

  <!-- Toggle Buttons -->
  <div class="d-flex justify-content-center gap-3 mb-4">
    <button onclick="toggleArticles()" class="btn btn-outline-dark btn-custom">Choose Articles</button>
    <button onclick="toggleCustomInput()" class="btn btn-outline-dark btn-custom">Submit Your Own Input ✍️</button>
  </div>

  <!-- Article Section -->
  <div id="articleSection" class="section-box" style="display: none;">
    <h4 class="mb-3">📰 Articles</h4>

    <input type="text" id="searchInput" class="form-control mb-3" placeholder="Search article title..." onkeyup="filterArticles()">

    <div class="row mb-3">
      <div class="col-md-6">
        <label for="from_date" class="form-label">From:</label>
        <input type="date" id="from_date" class="form-control" onchange="filterByDate()">
      </div>
      <div class="col-md-6">
        <label for="to_date" class="form-label">To:</label>
        <input type="date" id="to_date" class="form-control" onchange="filterByDate()">
      </div>
    </div>

    <ul class="list-group" id="articleList">
      {% for article in articles %}
        <li class="list-group-item article-item" data-index="{{ loop.index0 }}" style="display: {{ 'block' if loop.index0 < 10 else 'none' }}">
          <div class="form-check">
            <input type="checkbox" class="form-check-input article-checkbox" value="{{ article[0] }}">
            <label class="form-check-label">
              <a href="{{ article[1] }}" target="_blank"><strong>{{ article[2] }}</strong></a> ({{ article[4] }})
            </label>
          </div>
        </li>
      {% endfor %}
    </ul>

    <div class="mt-3 text-center">
      <button id="showMoreBtn" onclick="showMoreArticles()" class="btn btn-outline-primary btn-sm">Show More</button>
      <button id="showLessBtn" onclick="showLessArticles()" class="btn btn-outline-secondary btn-sm">Show Less</button>
    </div>
  </div>

  <!-- Custom Input Section -->
  <div id="customInputSection" class="section-box" style="display: none;">
    <textarea id="custom_content" class="form-control" rows="6" placeholder="Enter your custom article or content here..."></textarea>
  </div>

  <!-- Generate Quiz Section -->
  <div class="section-box">
    <h4 class="mb-3">🧠 Generate Quiz:</h4>
    <form id="combinedForm" action="{{ url_for('generate_questions', article_id=0) }}" method="POST">
      <input type="hidden" name="selected_articles" id="selected_articles_input">
      <input type="hidden" name="custom_content_hidden" id="custom_content_hidden">

      <div class="mb-3">
        <input type="number" name="num_questions" class="form-control" placeholder="Number of questions " min="1" max="10" required>
      </div>

      <div class="mb-3">
        <label for="method" class="form-label">Select Method:</label>
        <select name="method" class="form-select" required>
          <option value="mcq">MCQ</option>
          <option value="bool">Boolean</option>
          <option value="faq">FAQ</option>
        </select>
      </div>

      <button type="submit" onclick="prepareForm()" class="btn btn-success w-100">Generate Quiz</button>
    </form>
  </div>

  <!-- Bottom Buttons -->
  <div class="text-center mt-4">
    <form action="{{ url_for('paraphrase_page') }}" method="GET" class="d-inline">
      <button type="submit" class="btn btn-warning me-2">📝 Paraphrase</button>
    </form>

    <form action="{{ url_for('question_answering') }}" method="GET" class="d-inline">
      <button type="submit" class="btn btn-info me-2">❓ Clear Doubts</button>
    </form>

    <a href="/logout" class="btn btn-danger">🔒 Logout</a>
  </div>
</div>

<script>
// JavaScript unchanged
let visibleCount = 10;

function toggleArticles() {
    const articleSection = document.getElementById('articleSection');
    articleSection.style.display = articleSection.style.display === 'none' ? 'block' : 'none';
}

function showMoreArticles() {
    const allArticles = document.querySelectorAll('.article-item');
    for (let i = visibleCount; i < visibleCount + 10 && i < allArticles.length; i++) {
        allArticles[i].style.display = 'block';
    }
    visibleCount += 10;
    if (visibleCount >= allArticles.length) {
        document.getElementById('showMoreBtn').style.display = 'none';
    }
}

function showLessArticles() {
    const allArticles = document.querySelectorAll('.article-item');
    visibleCount = Math.max(0, visibleCount - 10);
    for (let i = 0; i < allArticles.length; i++) {
        allArticles[i].style.display = (i < visibleCount) ? 'block' : 'none';
    }
    if (visibleCount < allArticles.length) {
        document.getElementById('showMoreBtn').style.display = 'inline-block';
    }
}

function filterArticles() {
    const input = document.getElementById('searchInput').value.toLowerCase();
    const articles = document.querySelectorAll('.article-item');
    articles.forEach(article => {
        const title = article.querySelector('strong').textContent.toLowerCase();
        article.style.display = title.includes(input) ? 'block' : 'none';
    });
}

function toggleCustomInput() {
    const section = document.getElementById('customInputSection');
    section.style.display = section.style.display === 'none' ? 'block' : 'none';
}

function prepareForm() {
    const checkboxes = document.querySelectorAll('.article-checkbox');
    const selected = Array.from(checkboxes)
        .filter(cb => cb.checked)
        .map(cb => cb.value);
    document.getElementById('selected_articles_input').value = selected.join(',');

    const customContent = document.getElementById('custom_content').value.trim();
    document.getElementById('custom_content_hidden').value = customContent;
}

function filterByDate() {
    const fromDate = document.getElementById('from_date').value;
    const toDate = document.getElementById('to_date').value;
    const articles = document.querySelectorAll('.article-item');

    function convertToComparableDate(dateStr) {
        const parts = dateStr.split('-');
        const year = parts.length === 3 && parts[2].length === 4 ? parts[0] : '20' + parts[2];
        const month = parts[parts.length === 3 ? 1 : 0];
        const day = parts[parts.length === 3 ? 0 : 1];
        return `${year}-${month.padStart(2, '0')}-${day.padStart(2, '0')}`;
    }

    articles.forEach(article => {
        const articleDateText = article.querySelector('a').textContent.match(/\((\d{2}-\d{2}-\d{4}|\d{4}-\d{2}-\d{2})\)/);
        if (!articleDateText) return;

        const articleDateStr = articleDateText[1];
        const articleComparableDate = convertToComparableDate(articleDateStr);

        const fromComparableDate = fromDate ? convertToComparableDate(fromDate) : null;
        const toComparableDate = toDate ? convertToComparableDate(toDate) : null;

        const withinRange = (!fromComparableDate || articleComparableDate >= fromComparableDate) &&
                            (!toComparableDate || articleComparableDate <= toComparableDate);

        article.style.display = withinRange ? 'block' : 'none';
    });
}
</script>

</body>
</html>
