<!DOCTYPE html>
<html>
<head>
    <title>Paraphrase a Question</title>
    <link rel="stylesheet" href="/static/styles.css">
    <style>
        .container {
            margin: 50px auto;
            width: 80%;
            max-width: 600px;
            text-align: center;
        }
        textarea {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            resize: vertical;
        }
        button {
            margin-top: 20px;
            padding: 10px 20px;
        }
        .result {
            margin-top: 30px;
            text-align: left;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Paraphrase a Question</h2>
        <form method="POST" action="{{ url_for('paraphrase_page') }}">
            <textarea name="input_question" rows="5" placeholder="Enter your question here..." required></textarea>
            <br>
            <button type="submit">Generate Paraphrase</button>
        </form>

        {% if questions %}
        <div class="result">
            <h3>Paraphrased Questions:</h3>
            <ul>
                {% for q in questions %}
                    <li>{{ q }}</li>
                {% endfor %}
            </ul>
        </div>
        {% endif %}
    </div>
</body>
</html>
