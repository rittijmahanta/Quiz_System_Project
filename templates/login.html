<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Log In</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #74ebd5 0%, #ACB6E5 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }
        .login-container {
            background: rgba(255, 255, 255, 0.85);
            border-radius: 20px;
            padding: 40px 30px;
            width: 100%;
            max-width: 420px;
            backdrop-filter: blur(10px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.2);
            text-align: center;
            animation: fadeIn 0.6s ease-in-out;
        }
        .input-group-custom {
            position: relative;
            margin-bottom: 20px;
        }
        .input-group-custom img {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 22px;
            height: 22px;
            opacity: 0.7;
        }
        .input-group-custom input {
            padding-left: 48px;
            height: 48px;
            border-radius: 12px;
            border: 1px solid #ced4da;
            background-color: #f8f9fa;
            transition: border-color 0.3s;
        }
        .input-group-custom input:focus {
            border-color: #4CAF50;
            box-shadow: 0 0 0 0.2rem rgba(76, 175, 80, 0.25);
        }
        .primary-button {
            background: linear-gradient(135deg, #4CAF50 0%, #66bb6a 100%);
            color: white;
            border: none;
            border-radius: 14px;
            padding: 14px 20px;
            font-size: 16px;
            width: 100%;
            transition: background 0.3s, transform 0.2s;
        }
        .primary-button:hover {
            background: linear-gradient(135deg, #43a047 0%, #5fb760 100%);
            transform: translateY(-2px);
        }
        .arrow {
            margin-left: 8px;
        }
        .secondary-actions {
            margin-top: 25px;
        }
        .secondary-actions a {
            text-decoration: none;
            color: #0d6efd;
            font-weight: 500;
        }
        .secondary-actions a:hover {
            text-decoration: underline;
        }
        .register-link {
            font-weight: bold;
            color: #2c7be5;
        }
        @keyframes fadeIn {
            from {opacity: 0; transform: translateY(-20px);}
            to {opacity: 1; transform: translateY(0);}
        }
    </style>
</head>
<body>

{% with messages = get_flashed_messages() %}
{% if messages %}
<script>
    alert("{{ messages[0] }}");
</script>
{% endif %}
{% endwith %}

<div class="login-container">
    <h1 class="mb-3 fw-bold">Welcome Back!</h1>
    <h4 class="mb-4 text-muted">Log in to your account</h4>
    <form method="POST" action="/">
        <div class="input-group-custom">
            <label for="username">
                <img src="{{url_for('static',filename='images/user-icon.png')}}" alt="Username Icon">
            </label>
            <input type="text" id="username" name="username" class="form-control" placeholder="Username" required>
        </div>
        <div class="input-group-custom">
            <label for="password">
                <img src="{{url_for('static',filename='images/password-icon.png')}}" alt="Password Icon">
            </label>
            <input type="password" id="password" name="password" class="form-control" placeholder="Password" required>
        </div>
        <button type="submit" class="primary-button">Continue to Account <span class="arrow">→</span></button>
    </form>
    <div class="secondary-actions mt-4">
        <p><a href="#">Having Issues?</a></p>
        <p>Don't have an account? <a href="/signup" class="register-link">SIGNUP</a></p>
    </div>
</div>

<!-- Bootstrap 5 JS Bundle (Optional for Bootstrap components) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
