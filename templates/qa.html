<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Question and Answer</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f0f2f5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .main-container {
            padding: 40px 20px;
        }
        .card-custom {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
            animation: fadeIn 0.5s ease-in-out;
        }
        .article-item {
            background: #eef1f5;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 12px;
            transition: all 0.3s;
            cursor: pointer;
        }
        .article-item:hover {
            background: #dee2e6;
            transform: translateY(-2px);
        }
        .modal-custom {
            background: white;
            border-radius: 12px;
            padding: 25px;
            max-width: 600px;
            width: 90%;
            margin: auto;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.2);
            position: fixed;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1050;
            animation: fadeIn 0.4s ease;
        }
        #modalContent {
            margin-top: 20px;
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid #dee2e6;
            padding: 15px;
            border-radius: 8px;
            background: #f8f9fa;
        }
        #answerBox {
            margin-top: 15px;
            resize: vertical;
        }
        #generatedAnswer {
            margin-top: 20px;
            background: #e9ecef;
            border: 1px dashed #6c757d;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }
        #showMoreBtn {
            margin-top: 20px;
            width: 100%;
        }
        #closeModal {
            float: right;
            font-size: 28px;
            font-weight: bold;
            color: #6c757d;
            cursor: pointer;
        }
        #closeModal:hover {
            color: #343a40;
        }
        @keyframes fadeIn {
            from {opacity: 0; transform: translateY(-20px);}
            to {opacity: 1; transform: translateY(0);}
        }
    </style>
</head>
<body>

<div class="container main-container">
    <div class="card card-custom">
        <h2 class="text-center mb-4">📝 Question & Answer Portal</h2>

        <div id="articleSection">
            <h4 class="mb-3">Available Articles</h4>

            <input type="text" id="searchInput" class="form-control mb-4" placeholder="🔍 Search article title..." onkeyup="filterArticles()">

            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <label for="from_date" class="form-label">From Date:</label>
                    <input type="date" id="from_date" class="form-control" onchange="filterByDate()">
                </div>
                <div class="col-md-6">
                    <label for="to_date" class="form-label">To Date:</label>
                    <input type="date" id="to_date" class="form-control" onchange="filterByDate()">
                </div>
            </div>

            <ul id="articleList" class="list-unstyled">
                {% for article in articles %}
                    <li class="article-item" data-index="{{ loop.index0 }}" style="display: {{ 'block' if loop.index0 < 10 else 'none' }}">
                        <a href="#" class="article-link text-decoration-none text-dark fw-semibold" data-article-id="{{ article[0] }}" data-content="{{ article[3] }}">
                            {{ article[2] }}
                        </a> 
                        <small class="text-muted d-block mt-1">Published: {{ article[4] }}</small>
                    </li>
                {% endfor %}
            </ul>

            <!-- Modal -->
            <div id="contentModal" class="modal-custom" style="display:none;">
                <span id="closeModal">&times;</span>

                <div id="modalContent"></div>

                <textarea id="answerBox" rows="4" class="form-control mt-3" placeholder="❓ Ask something about this article..."></textarea>
                <button id="answerButton" class="btn btn-success w-100 mt-3">Get Answer</button>

                <div id="generatedAnswer"></div>
            </div>

            <button id="showMoreBtn" class="btn btn-primary mt-4">Show More Articles</button>

        </div>

        <div class="text-center mt-5">
            <a href="/home" class="btn btn-outline-secondary">← Return Home</a>
        </div>
    </div>
</div>

<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- Modal and Article Handling JS -->
<script>
document.addEventListener('DOMContentLoaded', function () {
    const articleLinks = document.querySelectorAll('.article-link');
    const modal = document.getElementById('contentModal');
    const modalContent = document.getElementById('modalContent');
    const closeModal = document.getElementById('closeModal');
    let currentArticleId = '';

    articleLinks.forEach(link => {
        link.addEventListener('click', function (e) {
            e.preventDefault();
            const content = this.getAttribute('data-content');
            const articleId = this.getAttribute('data-article-id');
            
            modalContent.innerHTML = content;
            modal.style.display = 'block';
            currentArticleId = articleId;
            document.getElementById('generatedAnswer').style.display = 'none';
        });
    });

    closeModal.addEventListener('click', function () {
        modal.style.display = 'none';
    });

    window.addEventListener('click', function (e) {
        if (e.target == modal) {
            modal.style.display = 'none';
        }
    });

    document.getElementById('answerButton').addEventListener('click', function () {
        const question = document.getElementById('answerBox').value.trim();
        if (!question) {
            alert("⚠️ Please type a question first.");
            return;
        }

        fetch('/get_answer', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ article_id: currentArticleId, question: question })
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                const generatedAnswer = document.getElementById('generatedAnswer');
                generatedAnswer.innerHTML = "<b>Answer:</b> " + data.answer;
                generatedAnswer.style.display = 'block';
            } else {
                alert("❗ Error: " + data.error);
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert("Something went wrong.");
        });
    });
});

let visibleCount = 10;
function showMoreArticles() {
    const allArticles = document.querySelectorAll('.article-item');
    for (let i = visibleCount; i < visibleCount + 10 && i < allArticles.length; i++) {
        allArticles[i].style.display = 'block';
    }
    visibleCount += 10;
    if (visibleCount >= allArticles.length) {
        document.getElementById('showMoreBtn').style.display = 'none';
    }
}

function filterArticles() {
    const input = document.getElementById('searchInput').value.toLowerCase();
    const articles = document.querySelectorAll('.article-item');
    articles.forEach(article => {
        const title = article.textContent.toLowerCase();
        article.style.display = title.includes(input) ? 'block' : 'none';
    });
}

function filterByDate() {
    // Placeholder for future date filtering logic
}
</script>

</body>
</html>
