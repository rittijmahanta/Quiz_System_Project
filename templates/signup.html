<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #89f7fe 0%, #66a6ff 100%);
            font-family: 'Poppins', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }
        .signup-container {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            padding: 50px 35px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
            backdrop-filter: blur(12px);
            text-align: center;
            animation: fadeIn 0.8s ease;
        }
        .signup-container h1 {
            font-weight: 700;
            margin-bottom: 5px;
            font-size: 2rem;
            color: #333;
        }
        .signup-container h2 {
            font-size: 1.2rem;
            color: #6c757d;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }
        .input-group {
            position: relative;
            margin-bottom: 25px;
        }
        .input-group label img {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            width: 22px;
            height: 22px;
            opacity: 0.6;
        }
        .input-group input {
            padding-left: 52px;
            height: 50px;
            border-radius: 14px;
            border: 1px solid #ced4da;
            background: #f9fafb;
            width: 100%;
            transition: all 0.3s ease;
        }
        .input-group input:focus {
            border-color: #5cb85c;
            background: #ffffff;
            box-shadow: 0 0 8px rgba(92, 184, 92, 0.25);
        }
        .primary-button {
            background: linear-gradient(135deg, #28a745 0%, #5cb85c 100%);
            color: #fff;
            font-weight: 600;
            font-size: 17px;
            border: none;
            border-radius: 14px;
            padding: 14px;
            width: 100%;
            margin-top: 10px;
            transition: all 0.3s ease;
        }
        .primary-button:hover {
            background: linear-gradient(135deg, #218838 0%, #4cae4c 100%);
            transform: translateY(-2px);
            box-shadow: 0 8px 15px rgba(40, 167, 69, 0.3);
        }
        .flash {
            margin-top: 15px;
            font-size: 0.95rem;
            color: #e63946;
        }
        .secondary-actions {
            margin-top: 30px;
        }
        .secondary-actions p {
            font-size: 0.95rem;
            color: #555;
        }
        .secondary-actions a {
            text-decoration: none;
            color: #007bff;
            font-weight: 600;
        }
        .secondary-actions a:hover {
            text-decoration: underline;
            color: #0056b3;
        }
        @keyframes fadeIn {
            0% {opacity: 0; transform: translateY(-20px);}
            100% {opacity: 1; transform: translateY(0);}
        }
    </style>
</head>

<body>

<div class="container signup-container">
    <h1>Let's Get You Started</h1>
    <h2>SIGN UP</h2>
    <form method="POST" action="/signup">
        <div class="input-group">
            <label for="username">
                <img src="{{url_for('static',filename='images/user-icon.png')}}" alt="Name">
            </label>
            <input type="text" id="username" name="username" placeholder="Johnson Doe">
        </div>
        <div class="input-group">
            <label for="password">
                <img src="{{url_for('static',filename='images/password-icon.png')}}" alt="Password">
            </label>
            <input type="password" id="password" name="password" placeholder="Password">
        </div>
        <button type="submit" class="primary-button">Sign Up</button>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="flash {{ category }}">
                {{ message }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}
    </form>

    <div class="secondary-actions">
        <p>Existing Member? <a href="/">LOG IN</a></p>
    </div>
</div>

<!-- Bootstrap Bundle JS (optional for some components) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
