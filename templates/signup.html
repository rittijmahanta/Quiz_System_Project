<!DOCTYPE html>
<html lang="en">
<head>
    <title>Sign Up</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
    <div class="container signup-container">
        <h1>Let's Get You Started</h1>
        <h2>SIGN UP</h2>
        <form method="POST" action="/signup">
            <div class="input-group">
                <label for="username"><img src="{{url_for('static',filename='images/user-icon.png')}}" alt="Name"></label>
                <input type="text" id="username" name="username" placeholder="Johnson Doe">
            </div>
            <div class="input-group">
                <label for="password"><img src="{{url_for('static',filename='images/password-icon.png')}}" alt="Password"></label>
                <input type="password" id="password" name="password" placeholder="Password">
            </div>
            <button type="submit" class="primary-button">Continue to Account <span class="arrow">→</span></button>
        </form>
        <div class="secondary-actions">
            <p>Existing Member? <a href="/">LOG IN</a></p> </div>
    </div>
</body>
</html>
